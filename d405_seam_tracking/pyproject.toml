[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d405-seam-tracking"
version = "0.1.0"
description = "Independent experimental D405 image/depth seam evidence framework"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.12"
dependencies = ["numpy==1.26.4", "opencv-python==4.11.0.86", "PyYAML==6.0.3", "tank-vision-inspection==0.1.0"]

[project.optional-dependencies]
train = ["torch==2.5.1", "torchvision==0.20.1", "segmentation-models-pytorch==0.5.0", "timm==1.0.15", "onnx==1.17.0", "onnxruntime==1.20.1"]

[project.scripts]
d405-seam = "d405_seam_tracking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
