/**:
  ros__parameters:
    # 运行时终端日志开关：true 输出，false 静默。
    # 嵌入式设备默认关闭高频日志；终端 I/O 可能拖慢 ROS 回调并造成数据积压。
    #
    # 示例 1：日常运行（推荐）
    # 保持下面的默认值，只在没有可用点云时输出提示。
    #
    # 示例 2：排查 IMU 与 LiDAR 时间不同步
    # 将 sensor 下的 lidar_timestamp、imu_timestamp、imu_buffer_size、
    # self_sync、imu_lidar_desync 全部设为 true，采集数秒日志后改回 false。
    #
    # 示例 3：分析 LIO 性能和匹配质量
    # 将 lio.timing、preprocess.output_point_count、
    # voxel.feature_statistics 设为 true。
    log:
      lio:
        # 输出 "[ LIO ]: No point!!!"：当前帧没有可用于 LIO 的去畸变点云。
        # 该提示通常有价值，建议保持开启。
        no_points: true

        # 输出 "[ LIO ] Update Voxel Map"：每帧体素地图更新完成后打印。
        # 高频状态日志，日常运行建议关闭。
        voxel_map_update: false

        # 输出 "LIO Mapping Time" 时间表：下采样、ICP、地图更新、
        # 单帧总耗时和平均耗时。用于性能分析，日常运行建议关闭。
        timing: false
      preprocess:
        # 输出预处理前的原始 LiDAR 点数。用于检查雷达数据量是否异常。
        input_point_count: false

        # 输出盲区过滤、无效点过滤及抽样后的点数。
        # 用于调整 preprocess.blind 与 preprocess.point_filter_num。
        output_point_count: false
      voxel:
        # 输出原始点数、下采样点数、有效点面约束数与平均残差。
        # 用于评估 LIO 配准质量；平均残差持续增大通常意味着匹配变差。
        feature_statistics: false

        # 未达到局部地图滑窗触发距离时，输出当前累计位移。
        # 每帧都可能打印，日常运行建议关闭。
        map_sliding_below_threshold: false

        # 输出局部地图滑窗和清理的耗时。地图滑动导致卡顿时开启。
        map_sliding_timing: false

        # 输出每次局部地图滑窗删除的根体素数。
        # 用于确认局部地图正在清理，避免内存持续增长。
        cleanup: false
      sensor:
        # 输出每帧 /livox/lidar 的 header.stamp。
        # 用于排查 LiDAR 时间戳来源或时间跳变。
        lidar_timestamp: false

        # 输出每条 /livox/imu 的 header.stamp。IMU 频率高，日志量很大。
        imu_timestamp: false

        # 输出 "got imu ... imu size ..."，即当前 IMU 缓冲区长度。
        # 若该数值持续增大，说明 IMU 消费跟不上，存在算力或回调积压。
        imu_buffer_size: false

        # 当最新 IMU 与 LiDAR 相差超过 1 秒时输出估计偏差。
        # 这是诊断信息；当前代码不会据此自动修正时间。
        self_sync: false

        # 当当前 IMU 与最新 LiDAR 相差超过 0.5 秒时输出警告。
        # 用于排查设备时间基准不同或 ROS 回调处理积压。
        imu_lidar_desync: false
