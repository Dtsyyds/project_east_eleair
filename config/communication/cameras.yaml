# 三相机现场采集。通过 deploy/run.sh --config config/communication/cameras.yaml 显式选择。
# 独立完整配置，不改变 system.yaml 的整机设备要求。
ros_domain_id: 77
http_port: 8080
websocket_port: 9001
data_root: /media/mcap_data
minimum_free_bytes: 5368709120
collection_profile:
  id: three_cameras
  label: 三相机采集
required_topics:
  - /camera/front/image_raw
  - /camera/fisheye/image_raw
  - /d405/camera/color/image_raw
  - /d405/camera/depth/image_rect_raw
  - /d405/camera/infra1/image_rect_raw
  - /d405/camera/infra2/image_rect_raw
hardware:
  start_mid360: false
  publish_rough_extrinsics: false
  start_eddy: false
  start_sync: false
  mindvision_resolution_index: 3
  mindvision_width: 1920
  mindvision_height: 1200
  # 两台 D405 任接一台；逗号分隔允许的 SDK 序列号，换机无需改配置。
  d405_serial_number: "260322276866,352122271190"
  # 当前连接的诊断配置；原 1280x720x30 仍出现 USB 停流。
  d405_rgb_profile: 640x480x15
  d405_depth_profile: 640x480x15
emat:
  saved_waveform: experiments/emat/采集数据.txt
  # 未接入测厚设备；实时测厚应明确失败，不探测未知串口。
  serial_port: /dev/emat
  baudrate: 115200
  sample_count: 4000
  read_interval_ms: 10
  sound_speed_m_s: 3240.0
  sampling_rate_hz: 40000000.0
  adc_zero: 127.0
  start_sample: 200
  calibrated: false
