# 现场固定配置，正常启动无需命令行参数。
ros_domain_id: 77
http_port: 8080
websocket_port: 9001
data_root: /media/mcap_data
minimum_free_bytes: 5368709120
required_topics:
  - /camera/front/image_raw
  - /camera/fisheye/image_raw
  - /d405/camera/color/image_raw
  - /d405/camera/depth/image_rect_raw
  - /eddy/data
hardware:
  # 本轮现场未接雷达；恢复接入时同时恢复 required_topics 的雷达/IMU 检查。
  start_mid360: false
  publish_rough_extrinsics: false
  mindvision_resolution_index: 3
  mindvision_width: 1920
  mindvision_height: 1200
  start_eddy: true
  start_sync: false
  # 使用 librealsense 的设备序列号；USB by-id 字符串中的序列号不同。
  # 两台 D405 任接一台；逗号分隔允许的 SDK 序列号，换机无需改配置。
  d405_serial_number: "260322276866,352122271190"
  # USB 排障暂用低带宽；原工程 1280x720x30 尚未通过稳定性验收。
  d405_rgb_profile: 640x480x15
  d405_depth_profile: 640x480x15
emat:
  saved_waveform: experiments/emat/采集数据.txt
  # 当前 CH340 无唯一序列号：保留现场候选物理端口，避免同型号 by-id 重名。
  # 此端口尚未通过 EMAT 协议握手，需现场确认接线后更新，不能视为设备已验收。
  serial_port: /dev/serial/by-path/platform-34000000.pcie-pci-0000:07:00.0-usb-0:1.3:1.0-port0
  baudrate: 115200
  sample_count: 4000
  read_interval_ms: 10
  sound_speed_m_s: 3240.0
  sampling_rate_hz: 40000000.0
  adc_zero: 127.0
  start_sample: 200
  calibrated: false
