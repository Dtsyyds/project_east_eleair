# 底盘整合入口默认：三相机、MID360/IMU、涡流，同时保留 D405 候选循迹。
# 雷达沿用已安装驱动的 MID360_config.json；涡流必须有稳定 /dev/eddy 别名。
# EMAT 保持按需测厚；确认实际串口后配置，禁止猜测 CH340 设备身份。
ros_domain_id: 77
http_port: 8080
websocket_port: 9001
data_root: /media/mcap_data
minimum_free_bytes: 5368709120
collection_profile:
  id: robot_all
  label: 整机多传感器采集
required_topics:
- /d405/camera/color/image_raw
- /d405/camera/depth/image_rect_raw
- /d405/camera/infra1/image_rect_raw
- /d405/camera/infra2/image_rect_raw
- /camera/front/image_raw
- /camera/fisheye/image_raw
- /livox/lidar
- /livox/imu
- /eddy/data
- /eddy/channel_mean
record_topics:
- /camera/front/image_raw
- /camera/front/camera_info
- /camera/fisheye/image_raw
- /camera/fisheye/camera_info
- /d405/camera/color/image_raw
- /d405/camera/color/camera_info
- /d405/camera/depth/image_rect_raw
- /d405/camera/depth/camera_info
- /d405/camera/infra1/image_rect_raw
- /d405/camera/infra1/camera_info
- /d405/camera/infra2/image_rect_raw
- /d405/camera/infra2/camera_info
- /d405/camera/extrinsics/depth_to_color
- /d405/camera/extrinsics/depth_to_infra1
- /d405/camera/extrinsics/depth_to_infra2
- /vision/d405_seam/result
- /vision/d405_seam/path_3d
- /vision/d405_seam/diagnostics
- /livox/lidar
- /livox/imu_raw
- /livox/imu
- /robot/odometry
- /robot/state
- /inspection/ultrasound/raw
- /inspection/eddy_current/raw
- /eddy/data
- /eddy/channel_mean
- /eddy/status
- /inspection/probe_state
- /tf
- /tf_static
- /diagnostics
- /derived/inspection/fusion_index
- /aft_mapped_to_init
- /weld_tracking/error
- /weld_tracking/source_alive
- /weld_tracking/candidates
- /weld_tracking/select_candidate
- /weld_tracking/selection_status
- /inspection/emat/result
vision:
  label: A + 二维中线 + 丢线候选选择
  algorithm_config: d405/round1_a.yaml
  python: .runtime/s100p/d405_prototype_venv/bin/python
  runtime_mode: candidate
hardware:
  start_mindvision: true
  start_fisheye: true
  start_d405: true
  start_mid360: true
  publish_rough_extrinsics: false
  start_eddy: true
  start_sync: false
  d405_serial_number: 260322276866,352122271190
  d405_rgb_profile: 640x480x15
  d405_depth_profile: 640x480x15
  mindvision_resolution_index: 3
  mindvision_width: 1920
  mindvision_height: 1200
  eddy_device: /dev/eddy
emat:
  saved_waveform: experiments/emat/采集数据.txt
  serial_port: /dev/emat
  baudrate: 115200
  sample_count: 4000
  read_interval_ms: 10
  sound_speed_m_s: 3240.0
  sampling_rate_hz: 40000000.0
  adc_zero: 127.0
  start_sample: 200
  calibrated: false
