# msg_MID360_launch.py 专用启动配置。
# 可选 mid360 / mid360s（不区分大小写）；每次启动只选择一种型号。
# mid360  -> MID360_config.json
# mid360s -> MID360s_config.json
# 设备 IP、主机 IP 和端口仍在各自 JSON 中配置。
lidar_model: mid360s

driver_parameters:
  # 1：Livox CustomMsg ； 0：PointCloud2 
  xfer_format: 1
  # 0：共用 /livox/lidar 和 /livox/imu；1：按设备区分话题。
  multi_topic: 0
  data_src: 0
  publish_freq: 10.0
  output_data_type: 0
  frame_id: livox_frame
  # data_src=0 时不使用下面的历史 LVX 路径。
  lvx_file_path: /home/livox/livox_test.lvx
  cmdline_input_bd_code: livox0000000001
