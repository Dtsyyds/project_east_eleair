# 现场固定配置，正常启动无需命令行参数。
ros_domain_id: 77
http_port: 8080
websocket_port: 9001
data_root: /media/mcap_data
minimum_free_bytes: 5368709120
required_topics:
  - /camera/front/image_raw
  - /camera/fisheye/image_raw
  - /d405/camera/color/image_raw
  - /d405/camera/depth/image_rect_raw
  - /livox/lidar
  - /livox/imu
  - /eddy/data
hardware:
  mindvision_resolution_index: 3
  mindvision_width: 1920
  mindvision_height: 1200
  start_eddy: true
  start_sync: false
  d405_serial_number: "260322276866"
  d405_rgb_profile: 1280x720x30
  d405_depth_profile: 1280x720x30
emat:
  saved_waveform: physic_bev/src/emat/jiancepy/采集数据.txt
  # 当前 CH340 无唯一序列号：按已验证的 USB 物理端口绑定，避免同型号 by-id 重名。
  # 电磁超声须保持连接此端口；换口后需重新确认并更新路径。
  serial_port: /dev/serial/by-path/platform-34000000.pcie-pci-0000:07:00.0-usb-0:1.3:1.0-port0
  baudrate: 115200
  sample_count: 4000
  read_interval_ms: 10
  sound_speed_m_s: 3240.0
  sampling_rate_hz: 40000000.0
  adc_zero: 127.0
  start_sample: 200
  calibrated: false
