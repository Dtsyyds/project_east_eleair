[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "east-eleair-slam-console"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "PyYAML==6.0.3", "websockets==15.0.1"]

[tool.setuptools]
packages = ["slam_console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
