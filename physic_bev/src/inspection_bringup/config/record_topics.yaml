production:
  max_bag_size: 10737418240
  max_bag_duration: 900
  # rosbag2 uses two cache buffers, so peak allocation can be about twice this.
  max_cache_size: 1073741824
debug:
  # A 4096x3072 BGR8 frame is 36 MiB. Avoid splitting every few frames.
  max_bag_size: 2147483648
  max_bag_duration: 30
  max_cache_size: 1073741824
